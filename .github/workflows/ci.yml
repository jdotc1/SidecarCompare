name: macOS build and test
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sidecar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Debug tests
        run: ./script/test.sh
      - name: Release tests
        run: ./script/test.sh release
      - name: Independent oracle
        run: python3 script/oracle_check.py
      - name: CLI smoke
        run: ./script/smoke.sh
      - name: Stage and verify development app
        run: ./script/build.sh release
